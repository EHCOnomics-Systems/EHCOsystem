selection:
  selected_by: Edward Henry
  selection_class: EXPLICIT_OWNER_DIRECTION
  durable_reference: |-
    Edward Henry directed implementation of a fail-closed pre-publication disclosure prevention path so future EHCOsystem public GitHub work does not repeat provider-side sensitive-history cleanup.
    The selected result is to make public GitHub the destination after disclosure qualification rather than the first place disclosure qualification occurs, while preserving the current public repository, accepted technical evidence, proprietary implementation custody, and numerical standing 52/53.
    SOURCE_MAIN:ca895511ba284018feaa0922e88e437c519806fa
    PREPUBLICATION_DISCLOSURE_GATE_REQUIRED=true
    NEWLY_REACHABLE_GIT_OBJECT_SCAN_REQUIRED=true
    COMMIT_MESSAGE_AND_PROVIDER_REF_SCAN_REQUIRED=true
    PROVIDER_NARRATIVE_PREPUBLICATION_SCAN_REQUIRED=true
    EXACT_CANDIDATE_CLEARANCE_BINDING_REQUIRED=true
    POST_PUSH_CI_IS_DEFENSE_IN_DEPTH_NOT_CONFIDENTIALITY_BOUNDARY=true
    REAL_PRIVATE_LOCATORS_IN_PUBLIC_VALIDATOR_SOURCE_PROHIBITED=true
    TECHNICAL_EVIDENCE_DEMOTION=false
    CLAIM_WEAKENING=false
    STANDING_CHANGE=false
    RUNTIME_EFFECT=false
    AUTOMATIC_SUCCESSOR=false
  source_base_revision: ca895511ba284018feaa0922e88e437c519806fa
  expected_reviewed_head_revision: NOT_YET_QUALIFIED
control_anchor: AGENTS.md
status_owner_path: ehco.operation.yaml
accepted_standing: 52/53
active_operation:
  operation_id: EHCOSYSTEM-PUBLIC-PREPUBLISH-DISCLOSURE-GATE-001
  state: IN_PROGRESS
  authorization_mode: PUBLISH
  bounded_outcome: Implement and publish a disclosure-safe candidate that adds a fail-closed pre-provider gate for exact candidate Git objects and provider-facing metadata, installs a clone-local pre-push guard, strengthens structural disclosure detection without embedding protected identities, and retains GitHub CI/rulesets as defense in depth.
  remaining_bounded_work:
    - Implement the repository-owned pre-publication disclosure gate.
    - Add a clone-local pre-push installation route.
    - Scan newly reachable Git objects, commit messages, ref names and supplied provider metadata.
    - Bind successful clearance to the exact candidate SHA/tree outside the public tree.
    - Add synthetic regression tests proving clean pass and transient-history/provider-metadata rejection.
    - Reconcile assistant entry, Governance, Security, Provenance, verification guidance, PR template and CI with the same disclosure boundary.
    - Publish a draft pull-request candidate and obtain exact-head repository validation, CodeQL and EHCO Assistant Operation Gate results.
  interaction_seams:
    - The current EHCO-PUB-SOW-010 Drive control owns the zero-private-topology objective and public-disclosure contract.
    - EHCOnomics-Systems/EHCOsystem owns exact public source, Git objects, refs, workflows, pull requests and repository-validation state.
    - Clone-local Git custody owns the pre-provider hook installation and clearance receipt.
    - GitHub-hosted validation remains provider-side regression evidence after a candidate becomes public.
    - Existing owning technical evidence retains all established technical effects and claim ceilings.
    - INSTANTIATED_EHCO_RUNTIME retains Tier One Runtime authority and Runtime state.
  non_overlap:
    - No destructive history rewrite, provider cache purge or repository replacement.
    - No private repository, Drive-control or host locator is added to public detection source.
    - No accepted technical evidence, architecture, benchmark, proof result, maturity or public claim is demoted.
    - No standing change from 52/53.
    - No Runtime, deployment, production, release, authority, admission, participation or persistence effect.
    - No open-source conversion or proprietary implementation-source publication.
    - No automatic successor.
  automatic_successor: PROHIBITED
  successor_operation: NOT_SELECTED
execution_continuity:
  policy_id: EHCO_EXECUTION_CONTINUITY_V1
  model_scope: ALL_ASSISTANT_MODELS
  work_unit: SELECTED_OPERATION_CHAIN
  depth_policy: COMPLETE_DEPENDENT_STEPS_WITHIN_SCOPE
  failure_policy: DIAGNOSE_CORRECT_REVERIFY_CONTINUE
  intra_scope_reapproval: NOT_REQUIRED
  cleanup_policy: RECONCILE_OPERATIONAL_DEBRIS_BEFORE_COMPLETE
  stop_policy: REAL_SCOPE_AUTHORITY_SAFETY_OR_OWNER_BOUNDARY_ONLY
