evidence:
  evidence_class: REPOSITORY_SOURCE_AND_DIFF_VALIDATION
  required_checks:
    - The nine manifest-bound C1B protocol files must remain byte-identical to preregistration identity 8a1a05b4865eaefa716e77cbe669e819e7d6e5b3.
    - The exact official comparison result SHA-256 must remain 0010b0f2f0369d9328d34e23d44e7117c038038ce4260a14cb51d0b1ad71e38b and no official rerun may occur.
    - The canonical public verifier must validate C1B preregistration package integrity, official result-manifest closure, machine verification discovery, launch-baseline candidate cross-bindings, reproduction contract state, launch-level threat-model coverage, and required public routes.
    - The launch-level threat/failure model must explicitly cover static replay, artifact/fixture substitution, post-result protocol drift, hidden dependency, reference-baseline drift, asymmetric comparative configuration, selective result omission, integrity bypass, and claim-scope inflation with controls or disclosed limitations.
    - Machine-readable verification discovery and Public Launch Baseline candidate hashes must match the exact corrected verifier/threat-model bytes.
    - The selected GitHub Wiki feature must be enabled and the reader-reference layer must have established page materialization, provider readback, working navigation, and reference alignment; GitHub U+2010 page-identity normalization is provider behavior and not by itself an acceptance defect.
    - The source-controlled reader reference must not falsely state that Wiki is disabled and must preserve subordinate evidence ownership.
    - C1D public instructions must state the exact Linux x86-64 / CPython / frozen OPA environment requirements, exact-revision binding, privacy/attribution semantics and no-unpublished-intervention boundary.
    - The public launch validator must be able to structurally validate a returned C1D receipt and verify its canonical receipt SHA-256 without treating structural validity as C1D acceptance.
    - Independent external reproduction must remain NOT_ESTABLISHED until owning reviewer evidence is received and validated.
    - Canonical public repository validation must pass on the exact corrected candidate head.
    - CodeQL must pass on the exact corrected candidate head.
    - EHCO Assistant Operation Gate must pass on the exact corrected candidate head.
    - Public source must contain no real protected locator values or proprietary implementation source.
    - Accepted numerical standing must remain 52/53.
  proves:
    - The corrected public launch candidate closes the established repository-integrity and canonical-verifier acceptance blockers if the exact reviewed head qualifies.
    - The official C1B result remains bound to the immutable pre-result preregistration identity without rewriting the official result.
    - Launch-level threat/failure coverage is explicit without mutating the accepted C1 proof package.
    - The public C1D package exposes its exact environment, evidence-binding, receipt-integrity and attribution boundaries without claiming external reproduction.
    - The selected Wiki/reference layer is materialized, directly read back, navigable, and aligned to its qualified source projection; GitHub U+2010 page-identity normalization is retained as observation-only provider behavior.
  evidence_not_created:
    - Independent external third-party reproduction receipt
    - EHCO_PUBLIC_LAUNCH_BASELINE_V1_ACCEPTED
    - Final provider tag or Release checkpoint
    - New Runtime realization or current Runtime-state observation
    - Deployment, production, release, authority, standing, admission or participation effect
    - Any successor operation
stop_condition:
  - Stop this repository-remediation pass only after the latest PR #66 head is provider-resolvable and all required exact-head provider checks are reconciled; the selected Wiki/reference materialization and readback are already established.
  - Preserve the established Wiki materialization, provider readback, navigation and reference alignment; GitHub U+2010 page-identity normalization remains observation-only.
  - Do not mark PR #66 Ready, merge it, release, deploy, invoke Runtime, mutate authority or standing, issue Public Launch Baseline v1 acceptance, execute post-C1D discovery/reconstruction, select a replacement external reviewer, or activate a successor in this remediation.
  - Preserve the C1B preregistered nine-file package without further mutation.
  - Preserve accepted standing 52/53 and all Runtime, deployment, release, authority, standing, participation and successor effects as NONE or not established as applicable.