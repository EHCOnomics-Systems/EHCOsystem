bridge:
  applicability: NOT_APPLICABLE_NON_PARTICIPANT
  non_applicability_reason: Public-repository disclosure prevention does not establish Tier One Runtime participation.
  direct_invocation: PROHIBITED
  runtime_admission_status: NOT_ESTABLISHED
  participation_binding_status: NOT_ESTABLISHED
  canonical_runtime_receipt_status: NOT_ESTABLISHED
evidence:
  evidence_class: PUBLIC_REPOSITORY_DISCLOSURE_PREVENTION_CANDIDATE
  required_checks:
    - Canonical public repository validation must pass on the exact reviewed candidate head.
    - Pre-publication synthetic regression testing must prove safe candidate acceptance and rejection of transient historical exposure, commit-message exposure and provider-metadata exposure.
    - CodeQL must pass on the exact reviewed candidate head.
    - EHCO Assistant Operation Gate must pass on the exact reviewed candidate head.
    - Public disclosure detection source must contain no real protected locator values.
    - The normal publisher path must fail closed before a provider-visible ref is updated.
    - Accepted numerical standing must remain 52/53.
  proves:
    - Repository-source implementation of the bounded pre-publication disclosure prevention control if the selected candidate qualifies.
  evidence_not_created:
    - Absolute prevention against deliberate administrator bypass or ungoverned manual provider entry
    - Provider-side deletion or garbage-collection evidence
    - New Runtime realization or current Runtime-state observation
    - New benchmark or technical capability result
    - Deployment, production, release, authority, standing, admission or participation effect
    - Any successor operation
stop_condition:
  - Stop after the bounded draft PUBLISH candidate is created and exact-head provider checks are available or reported as pending.
  - Do not merge or mark ready for review without a separate owner-selected ACCEPT transition.
  - Do not weaken repository rulesets or use a provider route to bypass the pre-publication control.
  - Preserve accepted standing 52/53 and all Runtime, deployment, release, authority, standing, participation and successor effects as NONE or not established as applicable.
