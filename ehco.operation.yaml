    - Drive-owned SOW-10 and its owner C1D amendment own the meaning that external reproduction is optional supplemental evidence and non-blocking.
    - EHCOnomics-Systems/EHCOsystem owns exact current public source, repository validation state, PR lifecycle, canonical main, and reader/reference implementation.
