active_operation:
  operation_id: EHCOSYSTEM-PUBLIC-PROOF-KERNEL-PUBLISH-001
  state: ACTIVE
  authorization_mode: PUBLISH
  bounded_outcome: Implement and publish an exact disclosure-safe 14-path Public Proof Kernel candidate that provides fresh bounded executable public proof for its frozen synthetic protocol, integrates into canonical public repository validation, and remains explicitly separate from Runtime, standing, deployment, Language Model, Range Reactor, comparative-proof and full Public Launch Baseline acceptance effects.
  remaining_bounded_work:
    - Obtain exact-head canonical public repository validation.
    - Obtain exact-head CodeQL validation.
    - Obtain exact-head EHCO Assistant Operation Gate validation.
    - Reconcile any in-scope validation defects and reverify the exact candidate.
    - Stop after the bounded draft PUBLISH candidate is qualified on its exact head.
  interaction_seams:
    - The current EHCO-PUB-SOW-010 Drive control owns the public-launch objective, claim/evidence ceilings, prelaunch strategy and disclosure contract.
    - EHCOnomics-Systems/EHCOsystem owns exact public source, Git objects, refs, workflows, pull requests and repository-validation state.
    - GitHub-hosted validation remains provider-side regression evidence after a candidate becomes public.
    - Existing owning technical evidence retains all established technical effects and claim ceilings.
    - INSTANTIATED_EHCO_RUNTIME retains Tier One Runtime authority and Runtime state.
  non_overlap:
    - No destructive history rewrite, provider cache purge or repository replacement.
    - No private repository, Drive-control or host locator is added to public source.
    - No proprietary implementation source is copied or transferred.
    - No accepted technical evidence, architecture, benchmark, proof result, maturity or public claim is demoted.
    - No EHCO_PUBLIC_LAUNCH_BASELINE_V1_ACCEPTED receipt is created by this candidate.
    - No standing change from 52/53.
    - No Runtime, deployment, production, release, authority, admission, participation or persistence effect.
    - No open-source conversion or proprietary implementation-source publication.
    - No automatic successor.
