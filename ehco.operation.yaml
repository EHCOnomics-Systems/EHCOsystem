  bounded_outcome: >-
    Publish an exact-head-qualified EHCOsystem candidate whose active public Language Model narrative is capability-based, affirmative and source-grounded; removes stale internal stage/unit maturity presentation; preserves accepted capability/evidence distinctions; and machine-enforces the public representation rule.
