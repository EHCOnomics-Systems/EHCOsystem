evidence:
  evidence_class: REPOSITORY_AND_PUBLIC_RETRIEVAL_OBSERVATION_VALIDATION
  required_checks:
    - The nine manifest-bound C1B protocol files must remain byte-identical to preregistration identity 8a1a05b4865eaefa716e77cbe669e819e7d6e5b3.
    - The exact official comparison result SHA-256 must remain 0010b0f2f0369d9328d34e23d44e7117c038038ce4260a14cb51d0b1ad71e38b and no official rerun may occur.
    - The canonical public verifier must validate C1B preregistration package integrity, official result-manifest closure, machine verification discovery, launch-baseline candidate cross-bindings, reproduction contract state, launch-level threat-model coverage, and required public routes.
    - The launch-level threat/failure model must explicitly cover static replay, artifact/fixture substitution, post-result protocol drift, hidden dependency, reference-baseline drift, asymmetric comparative configuration, selective result omission, integrity bypass, and claim-scope inflation with controls or disclosed limitations.
    - Machine-readable verification discovery and Public Launch Baseline candidate hashes must match the exact corrected verifier/threat-model bytes.
    - The selected GitHub Wiki feature must remain enabled and the reader-reference layer must retain established page materialization, provider readback, working navigation, and reference alignment; GitHub U+2010 page-identity normalization is provider behavior and not by itself an acceptance defect.
    - Social-preview readiness and direct provider readback must remain established with no exact defect.
    - C1D independent external reproduction must remain explicitly NOT_ESTABLISHED unless owning reviewer evidence is received and validated, and its absence must not be represented as certification or corroboration.
    - C1D absence is non-blocking for the amended Public Launch Baseline v1 acceptance standard and remains visible as optional supplemental evidence.
    - The versioned AI epistemic reconstruction protocol and observation schema must remain public-safe and exact-head resolvable.
    - Reconstruction observations must use the exact published prompts without EHCO-specific coaching and must record retrieved public sources, expected elements, unsupported inference, missing linkage, and controlled-surface correction need.
    - Search, retrieval or AI non-observation must not be treated as technical demotion; only EHCOnomics-controlled routing, definition, provenance, identity or contradiction defects may drive corrective public-source mutation.
    - Canonical public repository validation must pass on the exact operation-reconciled candidate head.
    - CodeQL must pass on the exact operation-reconciled candidate head.
    - EHCO Assistant Operation Gate must pass on the exact operation-reconciled candidate head.
    - Public source must contain no real protected locator values or proprietary implementation source.
    - Accepted numerical standing must remain 52/53.
  proves:
    - The repository operation projection is reconciled to the owner-amended SOW-10 C1D classification without altering the frozen technical proof or comparison evidence.
    - Workstream L observations characterize public discovery/reconstruction behavior only and do not create or demote technical truth.
    - Any EHCOnomics-controlled public defect established by Workstream L is corrected and requalified before advancing to final candidate qualification.
    - The official C1B result remains bound to the immutable pre-result preregistration identity without rewriting or rerunning the official result.
    - Workstream J public reference/discovery/provider surfaces remain established, including social-preview readiness and provider readback with no exact defect.
  evidence_not_created:
    - Independent external third-party reproduction receipt
    - EHCO_PUBLIC_LAUNCH_BASELINE_V1_ACCEPTED
    - Final provider tag or Release checkpoint
    - New Runtime realization or current Runtime-state observation
    - Deployment, production, release, authority, standing, admission or participation effect
    - Any successor operation
stop_condition:
  - Stop this Workstream L pass only after the operation-reconciled PR #66 head is provider-resolvable, exact-head required checks are reconciled, the reconstruction protocol has been executed through the reasonably accessible selected observation routes, and every EHCOnomics-controlled defect found by those observations is either corrected and reverified or explicitly classified as a remaining acceptance blocker.
  - Preserve C1D as NOT_ESTABLISHED / OPTIONAL_SUPPLEMENTAL unless qualifying external evidence is actually received; do not manufacture or imply independent certification.
  - Do not mark PR #66 Ready, merge it, release, deploy, invoke Runtime, mutate authority or standing, issue Public Launch Baseline v1 acceptance, perform broader distribution, or activate a successor in this Workstream L operation.
