active_operation:
  operation_id: EHCOSYSTEM-SOW010-LAUNCH-INTEGRITY-REMEDIATION-001
  state: ACTIVE
  authorization_mode: PUBLISH
  bounded_outcome: Correct the established SOW-10 public-launch acceptance blockers on the existing draft PR #66 candidate by restoring preregistered C1B byte identity, extending canonical verification to the launch candidate estate, adding a launch-level comparative threat/failure model, reconciling the public operation projection, and removing the superseded competing public claim PR surface without accepting Public Launch Baseline v1.
  remaining_bounded_work:
  - Restore comparison/c1b/v1/README.md exactly to the public preregistration bytes at 8a1a05b4865eaefa716e77cbe669e819e7d6e5b3.
  - Add a launch-level public threat/failure model that carries C1/C1A controls forward and explicitly covers C1B baseline drift and asymmetric comparative configuration without mutating the accepted C1 proof package.
  - Add a dedicated public-launch candidate validator and wire it into verification/verify_all_public.py.
  - Update machine verification discovery and Public Launch Baseline candidate bindings to the extended verifier/threat-model state.
  - Reconcile verification documentation with the actual canonical validator set.
  - Close the superseded competing public claim draft PR #61 while preserving its public history.
  - Obtain exact-head canonical repository validation, CodeQL, EHCO Assistant Operation Gate, and provider readback for the corrected candidate.
  - Preserve C1D as NOT_ESTABLISHED until an owning independent external reproduction receipt is received and validated.
  interaction_seams:
  - The current owner-selected SOW owns the wider objective, claim/evidence ceilings, disclosure boundary, independent-reproduction requirement, launch acceptance sequence, and broader-distribution boundary.
  - EHCOnomics-Systems/EHCOsystem owns exact public source, Git objects, refs, workflows, pull requests, and repository-validation state.
  - Public preregistration identity 8a1a05b4865eaefa716e77cbe669e819e7d6e5b3 owns the frozen nine-file C1B pre-result package identity.
  - Owning one-shot execution evidence owns the official C1B result facts; this remediation may validate and preserve those facts but may not rerun or regenerate them.
  - Independent external reproduction remains separately required and cannot be created by repository remediation.
  - INSTANTIATED_EHCO_RUNTIME retains Tier One Runtime authority and Runtime state.
  non_overlap:
  - No destructive history rewrite, repository replacement, or provider-control weakening.
  - No semantic mutation of the preregistered nine-file C1B protocol package; the only authorized edit inside that set is byte-for-byte restoration of the mutated README to its preregistered content.
  - No rerun, suppression, replacement, or preferred-result regeneration of the official comparison.
  - No mutation of accepted C1 proof-kernel package bytes or their accepted identity.
  - No private repository, Drive-control route, credential, endpoint, protected host locator, or proprietary implementation source may be added to public source.
  - No EHCO_PUBLIC_LAUNCH_BASELINE_V1_ACCEPTED receipt, tag, release, or publication checkpoint is created in this remediation.
  - No independent external reproduction receipt is claimed or synthesized.
  - No standing change from 52/53.
  - No Runtime, deployment, production, release, authority, admission, participation, or persistence effect.
  - No automatic successor.
  automatic_successor: PROHIBITED
  successor_operation: NOT_SELECTED
