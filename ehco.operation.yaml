    - bind_runtime
effects:
  authority_effect: NONE
  standing_effect: NONE
  runtime_effect: NONE
  deployment_effect: NONE
  release_effect: NONE
  external_effect: NONE
bridge:
  applicability: NOT_APPLICABLE_NON_PARTICIPANT
  non_applicability_reason: Public repository release/provenance source preparation is separate from Runtime participation.
  direct_invocation: PROHIBITED
  runtime_admission_status: NOT_ESTABLISHED
  participation_binding_status: NOT_ESTABLISHED
  canonical_runtime_receipt_status: NOT_ESTABLISHED
evidence:
  evidence_class: REPOSITORY_SOURCE_AND_DIFF_VALIDATION
  required_checks:
    - Exact candidate changes only the six SOW-007 permitted paths relative to main 8d34904db195103ff7e840d0fac86027b7de9b54.
    - provenance.accepted_commit is grounded to the commit accepting the stable manifest bytes rather than current main.
    - provenance.artifact_digest records the source-only public-projection condition without self-reference.
    - Registered release identity remains v1.0.0-public with the established release title and does not assert live publication.
    - Validate evidence and public boundaries, CodeQL, and EHCO Assistant Operation Gate succeed on the exact candidate.
  proves:
    - Stable repository provenance semantics are explicit and non-circular.
    - Source-only public-projection artifact-digest treatment is explicit without borrowing unrelated evidence digests.
    - Registered release identity and live provider publication remain separate states.
    - The exact source candidate is qualified for later owner acceptance without creating a release effect.
  evidence_not_created:
    - Git tag or GitHub Release
    - Deployment or production activation
    - Runtime admission binding invocation participation authority state proof or canonical Runtime receipt
    - Numerical standing transition
    - Repository settings or ruleset mutation
    - Git history rewrite
stop_condition:
  - Verify the exact source diff is limited to the six declared paths.
  - Verify non-circular provenance and release-identity invariants through deterministic validation.
  - Require exact-head repository validation, CodeQL, and EHCO Assistant Operation Gate success.
  - Publish the exact qualified candidate as a draft pull request.
  - Stop before Ready, merge, tag/Release creation, deployment, Runtime action, standing transition, or successor activation.
