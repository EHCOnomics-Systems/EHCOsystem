  evidence_class: REPOSITORY_SOURCE_AND_DIFF_VALIDATION
  required_checks:
    - Exact candidate base remains accepted EHCOsystem main 9bac1d6af5210a596691530436429937169f527e.
    - Public first-contact surfaces state realized Tier One Runtime standing 52/53, Docker Portability deployment readiness, local self-hosted Docker operation and Dashboard local port-8080 origin consistently.
    - Public performance language keeps the 6.847-second large-ledger Runtime observation and 58.458-ms Range Reactor median in separate workload classes.
