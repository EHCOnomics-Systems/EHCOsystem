  repository_manifest_path: ehco.repository.yaml
  controlling_source_reference: Drive EHCO-PUB-SOW-007 release provenance preparation control
selection:
  selected_by: Edward Henry
  selection_class: EXPLICIT_OWNER_DIRECTION
  durable_reference: >-
    Edward Henry direction 2026-08-29 “proceed with next steps” selects the separately governed public release/provenance preparation lane after verified repository-cleanup closeout. This PUBLISH operation reconciles stable repository provenance semantics, public provenance/release explanation, deterministic validation, and the operation projection on exact base 8d34904db195103ff7e840d0fac86027b7de9b54. The canonical Repository Minimum Standard defines provenance.accepted_commit as the commit accepting the stable manifest/boundary baseline rather than current main; direct Git history establishes current ehco.repository.yaml bytes were last accepted by PR #24 merge eff9301e7c5ddfc0759ee0d7e3c026ad28c5670c. The public repository is source-only PUBLIC_EVIDENCE and has no separately built repository artifact, so provenance.artifact_digest is explicitly NOT_APPLICABLE_SOURCE_ONLY_PUBLIC_PROJECTION_NO_SEPARATE_BUILD_ARTIFACT rather than a self-hash. Provider creation of tag v1.0.0-public and GitHub Release remains outside this PUBLISH stage. STABLE_REPOSITORY_MANIFEST_CHANGE=true
  source_base_revision: 8d34904db195103ff7e840d0fac86027b7de9b54
  expected_reviewed_head_revision: NOT_APPLICABLE_UNTIL_ACCEPT
control_anchor: AGENTS.md
status_owner_path: ehco.operation.yaml
accepted_standing: 52/53
active_operation:
  operation_id: EHCO-PUBLIC-RELEASE-PROVENANCE-PREP-001
  state: ACTIVE
  authorization_mode: PUBLISH
  bounded_outcome: >-
    Resolve non-circular stable provenance semantics, align public release/provenance documentation and deterministic validation, and publish an exact qualified draft pull request without creating the provider release.
  remaining_bounded_work:
    - Reconcile stable provenance baseline and source-only artifact-digest semantics in ehco.repository.yaml.
    - Align public provenance and release-register explanation.
    - Extend deterministic validation and its documentation.
    - Qualify the exact candidate under repository and organization checks.
    - Publish the exact candidate as a draft pull request.
    - After separately selected provider release materialization, reconcile live tag and GitHub Release evidence.
  interaction_seams:
    - Canonical organization Repository Minimum Standard owns stable-manifest accepted_commit semantics.
    - Direct Git history owns the exact commit that last accepted current ehco.repository.yaml bytes.
    - GitHub tag and Releases surfaces own live release publication state.
    - Hash-bound dossier, evidence packets, Dashboard assets, Language Model fixtures, and Range Reactor evidence retain their own artifact identities.
    - INSTANTIATED_EHCO_RUNTIME retains Tier One Runtime authority and current Runtime-state ownership.
  non_overlap:
    - This PUBLISH operation does not create a Git tag or GitHub Release.
    - No deployment, production activation, Runtime action, authority/proof/participation effect, standing transition, history rewrite, repository-settings mutation, ruleset mutation, or successor activation is selected.
    - Stable manifest identity/classification/ownership/scope/security boundaries are preserved except for the explicitly selected provenance baseline and unresolved-item reconciliation.
  automatic_successor: PROHIBITED
  successor_operation: NOT_SELECTED
execution_continuity:
  policy_id: EHCO_EXECUTION_CONTINUITY_V1
  model_scope: ALL_ASSISTANT_MODELS
  work_unit: SELECTED_OPERATION_CHAIN
  depth_policy: COMPLETE_DEPENDENT_STEPS_WITHIN_SCOPE
  failure_policy: DIAGNOSE_CORRECT_REVERIFY_CONTINUE
  intra_scope_reapproval: NOT_REQUIRED
  cleanup_policy: RECONCILE_OPERATIONAL_DEBRIS_BEFORE_COMPLETE
  stop_policy: REAL_SCOPE_AUTHORITY_SAFETY_OR_OWNER_BOUNDARY_ONLY
  local_override: MAY_TIGHTEN_NOT_WEAKEN
