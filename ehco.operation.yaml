    - Strengthen public validation against internal-stage maturity presentation drift.
    - Run exact-head qualification and reconcile any in-scope failures.
    - Present the exact qualified candidate for Source ACCEPT and merge under repository rules when acceptance conditions are satisfied.
  interaction_seams:
    - Google Drive EHCO-PUB-SOW-004 owns capability-based public maturity meaning and the disclosure boundary.
    - EHCOsystem main@2f87a39c801ddd1e7a582f7302fb9ec65cae57ea is the exact public source base.
