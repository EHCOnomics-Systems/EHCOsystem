  repository_manifest_path: ehco.repository.yaml
  controlling_source_reference: Drive document 1FydQKUNfpQ7oZrgpLDlqRHxFM_f1mFv5uq_akploL38

selection:
  selected_by: Edward Henry
  selection_class: EXPLICIT_OWNER_DIRECTION
  durable_reference: >-
    Edward Henry selected completion of the current public EHCOsystem repository by publishing the
    already-established clean Full Flex packet bytes and associated owning-host receipt into the
    existing canonical Full Flex evidence path. The selected packet is the existing
    EHCO_FULL_FLEX_PUBLIC_PACKET_V1.json from the physical EHCO_DOCKER_PORTABILITY estate with
    SHA-256 7F80C27D085AE871A00AED412C6F20EA9A76CB0677C93AEBA381CD1FD70EC8E5.
    This operation retrieves and publishes existing evidence; it does not reconstruct or revalidate it.
    NEW_PATH:evidence/runtime/full-flex/v1/EHCO_FULL_FLEX_PUBLIC_PACKET_V1.json
    NEW_PATH:evidence/runtime/full-flex/v1/PACKET_RECEIPT.json
    No new Docker execution, Range Reactor execution, deployment, Runtime effect, standing transition,
    historical evidence rewrite, or automatic successor is selected.
  source_base_revision: aa681e61f8548add05ef9cb2872ef54901472ba3
  expected_reviewed_head_revision: NOT_APPLICABLE_UNTIL_ACCEPT

control_anchor: AGENTS.md
status_owner_path: ehco.operation.yaml
accepted_standing: 52/53

active_operation:
  operation_id: EHCO-RUNTIME-FULL-FLEX-EXACT-BYTE-PUBLICATION-002
  state: ACTIVE
  authorization_mode: PUBLISH
  bounded_outcome: >-
    Publish the exact existing host-established Full Flex JSON and associated packet receipt into
    evidence/runtime/full-flex/v1/, preserving exact byte identity, existing public evidence
    interpretation, accepted standing 52/53, source/evidence ownership, historical evidence,
    and all Runtime authority boundaries.
  remaining_bounded_work:
    - Publish the exact host-established EHCO_FULL_FLEX_PUBLIC_PACKET_V1.json bytes.
    - Publish the associated existing PACKET_RECEIPT.json bytes.
    - Verify staged and committed packet identity remains SHA-256 7F80C27D085AE871A00AED412C6F20EA9A76CB0677C93AEBA381CD1FD70EC8E5.
    - Verify staged and committed receipt identity remains identical to the owning-host receipt.
    - Run repository validation against the exact candidate.
    - Publish the clean candidate branch.
    - Open and inspect the bounded draft pull request and required checks.
  interaction_seams:
    - Drive owns durable Full Flex meaning, publication requirements, and established packet identity.
    - Direct EHCOsystem Git owns exact repository source, branch, pull-request, and accepted source state.
    - The owning Windows/Docker host owns the clean packet-generation result and exact physical artifact bytes.
    - EHCO_DOCKER_PORTABILITY remains PRIMARY_ACCESSIBLE_RUNTIME_PROJECTION.
    - INSTANTIATED_EHCO_RUNTIME retains Tier One Runtime authority and current Runtime state.
  non_overlap:
    - evidence/public-evidence-companion/v1/** remains immutable historical event-time evidence.
    - ehco.repository.yaml identity and boundary fields remain unchanged.
    - The Full Flex packet and receipt are retrieved existing evidence and are not reconstructed.
    - No new Docker execution, Range Reactor execution, benchmark, deployment, release, Runtime effect,
      Runtime participation, standing transition, repository-setting change, or successor activation
      is part of this operation.
  automatic_successor: PROHIBITED
  successor_operation: NOT_SELECTED

execution_continuity:
  policy_id: EHCO_EXECUTION_CONTINUITY_V1
  model_scope: ALL_ASSISTANT_MODELS
  work_unit: SELECTED_OPERATION_CHAIN
  depth_policy: COMPLETE_DEPENDENT_STEPS_WITHIN_SCOPE
  failure_policy: DIAGNOSE_CORRECT_REVERIFY_CONTINUE
  intra_scope_reapproval: NOT_REQUIRED
  cleanup_policy: RECONCILE_OPERATIONAL_DEBRIS_BEFORE_COMPLETE
  stop_policy: REAL_SCOPE_AUTHORITY_SAFETY_OR_OWNER_BOUNDARY_ONLY
  local_override: MAY_TIGHTEN_NOT_WEAKEN

scope:
  permitted_paths:
    - ehco.operation.yaml
    - evidence/runtime/full-flex/v1/EHCO_FULL_FLEX_PUBLIC_PACKET_V1.json
    - evidence/runtime/full-flex/v1/PACKET_RECEIPT.json
  controlled_paths:
    - ehco.operation.yaml
    - evidence/runtime/full-flex/v1/EHCO_FULL_FLEX_PUBLIC_PACKET_V1.json
    - evidence/runtime/full-flex/v1/PACKET_RECEIPT.json
  prohibited_paths:
    - AGENTS.md
    - ehco.repository.yaml
    - GOVERNANCE.md
    - SECURITY.md
    - NOTICE.md
    - PROVENANCE.md
    - evidence/public-evidence-companion/v1/**
    - architecture/**
    - assurance/**
    - releases/**
    - language-model/**
    - range-reactor/**

change_control:
  control_change_declared: true
  delete_or_move_authorized: false
  local_actions_authorized:
    - read_source
    - compare_source
    - audit
    - create_file
    - update_file
    - run_checks
  local_actions_prohibited:
    - move_file
    - delete_file
    - generate_artifact
  remote_actions_authorized:
    - create_branch
    - commit
    - push
    - open_draft_pull_request
    - update_draft_pull_request
  remote_actions_prohibited:
    - mark_pull_request_ready_for_review
    - merge_pull_request
    - record_owner_acceptance
    - close_operation
    - activate_selected_successor
    - modify_repository_settings
    - modify_drive_controls
    - publish_image
    - mutate_environment
    - deploy
    - trigger_workflow
    - release
    - invoke_runtime
    - admit_runtime
    - bind_runtime

effects:
  authority_effect: NONE
  standing_effect: NONE
  runtime_effect: NONE
  deployment_effect: NONE
  release_effect: NONE
  external_effect: NONE

bridge:
  applicability: NOT_APPLICABLE_NON_PARTICIPANT
  non_applicability_reason: Public evidence publication is separate from Runtime participation.
  direct_invocation: PROHIBITED
  runtime_admission_status: NOT_ESTABLISHED
  participation_binding_status: NOT_ESTABLISHED
  canonical_runtime_receipt_status: NOT_ESTABLISHED

evidence:
  evidence_class: REPOSITORY_SOURCE_AND_DIFF_VALIDATION
  required_checks:
    - Exact owning-host packet bytes are SHA-256 7F80C27D085AE871A00AED412C6F20EA9A76CB0677C93AEBA381CD1FD70EC8E5.
    - Git-staged and committed packet blobs preserve that exact SHA-256 identity.
    - Associated PACKET_RECEIPT.json preserves the existing owning-host receipt bytes.
    - Candidate changes remain limited to the selected three paths.
    - Existing public repository validation succeeds against the exact candidate.
    - Historical Public Evidence Companion bytes remain unchanged.
    - Accepted standing remains 52/53.
    - Automatic successor remains prohibited.
  proves:
    - Owner-selected exact-byte Full Flex public-source publication scope.
    - Exact existing host artifact identity is preserved into Git source custody.
    - Publication remains separate from Runtime authority and technical effects.
  evidence_not_created:
    - Owner acceptance
    - New Runtime authority or current Runtime state
    - New Docker execution or qualification
    - New Range Reactor execution or qualification
    - Runtime participation or admission
    - Deployment or release materialization
    - Numerical standing transition

stop_condition:
  - Stop if staged or committed Full Flex JSON differs from SHA-256 7F80C27D085AE871A00AED412C6F20EA9A76CB0677C93AEBA381CD1FD70EC8E5.
  - Stop if staged or committed PACKET_RECEIPT.json differs from the owning-host receipt bytes.
  - Stop if candidate paths expand beyond the selected exact-byte publication scope.
  - Continue automatically through branch publication, repository checks, and draft pull-request creation when the exact candidate is valid.
  - Do not merge or mark the pull request ready for review under this PUBLISH operation.
  - Preserve Runtime, deployment, release, authority, standing, participation, and successor effects as NONE.
