evidence:
  evidence_class: PUBLIC_SOURCE_REPRESENTATION_QUALIFICATION
  required_checks:
    - Changed paths remain within the exact SOW-004 permitted path set.
    - Active reader-facing Language Model maturity uses capability-based affirmative representation and contains no internal DF stage/unit maturity projection.
    - Accepted Language Model capability claims remain grounded in accepted owning source main@1382974ee309451b8c242b675efe78a689626d89.
    - Active Language Model development direction is represented qualitatively and is not promoted to accepted capability.
    - Existing affirmative public-representation, private-program exclusion, disclosure, dossier, evidence, link, secret-indicator and release-identity validations remain green.
    - Exact reviewed head passes Validate evidence and public boundaries, CodeQL and EHCO Assistant Operation Gate before acceptance.
    - Post-merge accepted main is read back and reconciled to Drive SOW-004.
  proves:
    - The EHCOsystem public Language Model story is capability-based, affirmative, source-grounded and resilient to internal stage-number churn.
    - Public readers can understand established depth and current strengthening direction without exposure of internal development sequencing.
  evidence_not_created:
    - Formal final Language Model completion
    - Language Model Source ACCEPT for active owning-repository candidate work
    - Artifact publication or release
    - Deployment or production activation
    - Runtime participation admission binding invocation persistence or canonical Runtime receipt
    - Authority proof external operational consequence or numerical standing change
stop_condition:
  - Reconcile the exact bounded public surfaces and validator.
  - Verify the exact candidate head passes all required repository evidence families.
  - Present and accept only the exact qualified candidate under repository rules.
  - Merge only with expected-head protection after qualification.
  - Read back accepted public main and reconcile the exact source result to Drive SOW-004.
  - Stop with automatic successor prohibited.
