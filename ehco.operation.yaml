  participation_binding_status: NOT_ESTABLISHED
  canonical_runtime_receipt_status: NOT_ESTABLISHED
evidence:
  evidence_class: PUBLIC_REPRESENTATION_PRECISION_CANDIDATE
  required_checks:
    - Canonical public repository validation must pass on the exact reviewed candidate head.
    - CodeQL must pass on the exact reviewed candidate head.
    - EHCO Assistant Operation Gate must pass on the exact reviewed candidate head.
    - Public local-operation language must remain bounded to the EHCO AI-OS Tier One Runtime proposition.
    - Public Range Reactor wording may state local Windows/WSL2 Docker portability execution only to the extent established by accepted benchmark and host-custody evidence.
    - Microsoft Surface or other exact hardware-device language must remain unasserted until owning hardware evidence exists.
    - Broader EHCO repository/component simultaneous local execution must remain explicitly unclaimed.
    - Accepted numerical standing must remain 52/53.
  proves:
    - Repository-source representation of the narrower Tier One local-Runtime claim and accepted Range Reactor local portability-environment relationship if the selected candidate qualifies.
  evidence_not_created:
    - New Runtime realization or current Runtime-state observation
    - Microsoft Surface model, CPU, RAM, or host-resource evidence
    - Full ecosystem simultaneous local execution
    - Tier Two deployment or Runtime participation
    - New benchmark or performance result
    - Deployment, production, release, authority, standing, admission, or persistence effect
    - Any successor operation
stop_condition:
  - Stop after the bounded draft PUBLISH candidate is updated and exact-head provider checks are available or reported as pending.
  - Do not merge or mark ready for review without a separate owner-selected ACCEPT transition.
  - Do not add Microsoft Surface or other hardware-specific claims until owning hardware evidence exists.
  - Preserve accepted standing 52/53 and all Runtime, deployment, release, authority, standing, participation and successor effects as NONE or not established as applicable.
