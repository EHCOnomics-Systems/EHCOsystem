    - compare_source
    - audit
    - create_file
    - update_file
    - run_checks
  local_actions_prohibited:
    - move_file
    - delete_file
    - generate_artifact
  remote_actions_authorized:
    - create_branch
    - commit
    - push
    - open_draft_pull_request
    - update_draft_pull_request
  remote_actions_prohibited:
    - merge_pull_request
    - activate_selected_successor
    - modify_repository_settings
    - modify_drive_controls
    - publish_image
    - mutate_environment
    - deploy
    - trigger_workflow
    - release
    - invoke_runtime
    - admit_runtime
    - bind_runtime
effects:
  authority_effect: NONE
  standing_effect: NONE
  runtime_effect: NONE
  deployment_effect: NONE
  release_effect: NONE
  external_effect: NONE
bridge:
  applicability: NOT_APPLICABLE_NON_PARTICIPANT
  non_applicability_reason: Public technical packaging and repository verification orchestration are separate from Runtime participation.
  direct_invocation: PROHIBITED
  runtime_admission_status: NOT_ESTABLISHED
  participation_binding_status: NOT_ESTABLISHED
  canonical_runtime_receipt_status: NOT_ESTABLISHED
evidence:
  evidence_class: PUBLIC_TECHNICAL_REVIEW_SURFACE_CANDIDATE
  required_checks:
    - Reviewer navigation exposes the canonical application/evidence index and unified public verification command.
    - Application/evidence index preserves public projection, owning source/evidence, currentness, and claim-ceiling distinctions.
    - Unknown owning revisions or ownership relationships are represented as NOT_ESTABLISHED_IN_PUBLIC_PACKAGE rather than inferred.
    - Unified verifier orchestrates existing specialized validators without replacing their logic or evidence classes.
    - Failure diagnostics identify the failing public check without converting non-observation into owning-state demotion.
    - Existing accepted evidence bytes and canonical claim registry remain unchanged.
    - Applicable repository validation, CodeQL, and EHCO Assistant Operation Gate pass for the exact candidate before ACCEPT.
    - 52/53 and all Runtime, deployment, release, authority, standing, participation, and successor effects remain NONE or not established as applicable.
  proves:
    - The exact candidate packages already-established public evidence into a reviewer-ready navigation, provenance, verification, and failure-diagnostic surface.
  evidence_not_created:
    - New implementation capability, physical execution, benchmark result, semantic correctness proof, Runtime participation, deployment, release, authority, standing effect, or successor activation.
stop_condition:
  - Exact PUBLISH candidate passes unified public verification and applicable repository validation, CodeQL, and EHCO Assistant Operation Gate.
  - Candidate remains unmerged until lawful ACCEPT transition records the exact reviewed PUBLISH head.
  - Stop with Runtime, deployment, release, authority, standing, participation, and successor effects remaining NONE or not established as applicable.
