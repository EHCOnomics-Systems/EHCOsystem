    - The owning Windows/Docker host owns the clean packet-generation result and exact physical artifact bytes.
    - EHCO_DOCKER_PORTABILITY remains PRIMARY_ACCESSIBLE_RUNTIME_PROJECTION.
    - INSTANTIATED_EHCO_RUNTIME retains Tier One Runtime authority and current Runtime state.
  non_overlap:
