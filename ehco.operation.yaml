  selection_class: EXPLICIT_OWNER_DIRECTION
  durable_reference: |-
    After acceptance and merge of PUBLIC-TECHNICAL-PACKAGING-SCOPE-PUBLICATION-001, Edward Henry explicitly directed EHCO1 to proceed to the next steps on 2026-08-31. This selects the first coherent implementation block of the accepted public technical packaging scope: reviewer navigation, application/component evidence indexing with currentness/provenance, unified public verification orchestration, and reviewer failure-path diagnostics. It packages already-established public evidence and does not create new technical evidence or technical effects.
    NEW_PATH:dossiers/public-technical-packaging/APPLICATION-EVIDENCE-INDEX.md
    NEW_PATH:verification/verify_all_public.py
    OPERATION_STABLE_ENVELOPE_CHANGE=true
  source_base_revision: 77b9d82e0e1bb63d932bd0c62ed98e6dfc32e4f5
  expected_reviewed_head_revision: NOT_YET_QUALIFIED
control_anchor: AGENTS.md
status_owner_path: ehco.operation.yaml
accepted_standing: 52/53
active_operation:
  operation_id: PUBLIC-TECHNICAL-REVIEW-SURFACE-IMPLEMENTATION-001
  state: ACTIVE
  authorization_mode: PUBLISH
  bounded_outcome: Implement and publish the first reviewer-ready technical packaging block: canonical reviewer navigation, application/evidence provenance-currentness index, unified public verification route, and bounded failure diagnostics.
  remaining_bounded_work:
    - Qualify the exact PUBLISH candidate through the unified public verification route and applicable repository checks.
    - Correct any in-scope validation or public-boundary failures and reverify.
    - Present the exact qualified candidate through the repository acceptance path without expanding into new evidence generation or technical effects.
  interaction_seams:
    - EHCOsystem owns the public review/index/orchestration surfaces created by this operation.
    - Direct owning repositories retain exact implementation-state ownership.
    - Owning technical evidence retains physical-effect ownership.
    - INSTANTIATED_EHCO_RUNTIME retains Tier One Runtime authority and current Runtime state.
  non_overlap:
    - No new component engineering, benchmark execution, semantic-test execution, accepted evidence-byte mutation, deployment, release, Runtime action, authority, standing, participation, or successor.
  automatic_successor: PROHIBITED
  successor_operation: NOT_SELECTED
execution_continuity:
  policy_id: EHCO_EXECUTION_CONTINUITY_V1
  model_scope: ALL_ASSISTANT_MODELS
  work_unit: SELECTED_OPERATION_CHAIN
  depth_policy: COMPLETE_DEPENDENT_STEPS_WITHIN_SCOPE
  failure_policy: DIAGNOSE_CORRECT_REVERIFY_CONTINUE
  intra_scope_reapproval: NOT_REQUIRED
  cleanup_policy: RECONCILE_OPERATIONAL_DEBRIS_BEFORE_COMPLETE
  stop_policy: REAL_SCOPE_AUTHORITY_SAFETY_OR_OWNER_BOUNDARY_ONLY
  local_override: MAY_TIGHTEN_NOT_WEAKEN
scope:
  permitted_paths:
