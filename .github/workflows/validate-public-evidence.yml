name: Validate public repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate evidence and public boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Validate complete public repository
        run: python3 verification/verify_all_public.py
