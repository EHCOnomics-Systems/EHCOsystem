name: Validate public repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate evidence and public boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate public evidence and semantic boundaries
        run: python3 verification/validate_public_evidence.py
